<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>profile header: the sign layer</title>
<!-- The still layer of the README's header, on a transparent 1280x400 canvas: the HELLO.EXE sign from
     the itch profile (itch-setup/art/banner.html, scaled up as a page so its text stays sharp).
     scripts/header.py lays it over the circuit background and the running signals, and floats the
     flyer over its corner. -->
<style>
html, body { margin: 0; background: transparent; }
.canvas { position: relative; width: 1280px; height: 400px; overflow: hidden; }
/* the sign's centre in banner.html is (490, 124); at 1.3x it lands at (610, 150) */
.sign { position: absolute; left: 0; top: 0; width: 960px; height: 400px; border: 0;
    transform-origin: 0 0; transform: translate(-27px, -11px) scale(1.3); }
</style>
</head>
<body>
<div class="canvas">
  <iframe class="sign" src="../../itch-setup/art/banner.html"></iframe>
</div>
</body>
</html>
